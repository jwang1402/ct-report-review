name: Deploy CT Report Review
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  workflow_run:
    workflows: [Publish synthetic validation case, Remove case from website, Register Drive case]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test backend/verify.mjs
      - run: npm run build
        env:
          VITE_DRIVE_API_KEY: ${{ vars.DRIVE_PUBLIC_API_KEY }}
          VITE_REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_KEY: ${{ vars.GOOGLE_PICKER_KEY }}
      - name: Mirror Release imaging into Pages (test deployment)
        run: node scripts/sync-pages-cases.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
