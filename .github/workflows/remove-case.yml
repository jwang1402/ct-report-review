name: Remove case from website
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
concurrency:
  group: case-catalog-removal
  cancel-in-progress: false
jobs:
  remove:
    if: startsWith(github.event.issue.title, '[CT-REMOVE] ') && github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/remove-case.mjs
        env:
          CT_REMOVE_EVENT: ${{ github.event_path }}
      - name: Save shared case catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/removed-cases.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove case from website catalog'
          git pull --rebase origin main
          git push origin main
